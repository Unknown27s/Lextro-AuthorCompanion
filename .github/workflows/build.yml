name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-native
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-native/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build prebuilt SQLite database
        run: npm run build:db

      # The react-native-android-widget config plugin executes during prebuild
      # (manifest receiver, font copy, provider class). Run prebuild here so
      # widget/app.json config errors fail fast instead of after the Gradle job.
      - name: Validate Expo prebuild & widget config
        run: npx expo prebuild --platform android --no-install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --ci

  # Expo managed workflow: prebuild generates android/ from app.json,
  # then Gradle compiles the release APK (JS bundled via Hermes, signed
  # with the debug keystore generated by prebuild — installable standalone).
  build-android:
    name: Build release APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend-native
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-native/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NDK 27.3.13750724 is pinned in app.json via expo-build-properties;
      # the new-architecture (C++) build fails without it.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;27.3.13750724 platforms;android-36'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # After prebuild so the generated Gradle files are part of the cache key.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: frontend-native/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lextro-release.apk
          path: frontend-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

